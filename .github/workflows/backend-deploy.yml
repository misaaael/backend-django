name: Backend CI

on:
  push:
    branches:
      - backend-django
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-ci:
    name: Validar backend Django
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validar identidade AWS
        run: aws sts get-caller-identity

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar projeto Django
        run: python manage.py check

      - name: Rodar testes
        run: python manage.py test

      - name: Validar build Docker
        run: docker build -t intelbras-backend-ci .
